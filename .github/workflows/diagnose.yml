name: Diagnose (temporary)

on:
  push:
    branches: [claude/peaceful-planck-bgmw3a]
    paths: ['.github/workflows/diagnose.yml']

permissions:
  contents: read

jobs:
  start:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish the branch
        run: >
          dotnet publish src/Moss365.Desktop -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: WebView2 runtime
        shell: pwsh
        run: |
          $wv2 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          Write-Host "before: $((Get-ItemProperty $wv2 -ErrorAction SilentlyContinue).pv)"
          if (-not (Get-ItemProperty $wv2 -ErrorAction SilentlyContinue).pv) {
            $setup = Join-Path $env:RUNNER_TEMP 'wv2.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            (Start-Process $setup -ArgumentList '/silent', '/install' -PassThru).WaitForExit()
          }
          Write-Host "after: $((Get-ItemProperty $wv2 -ErrorAction SilentlyContinue).pv)"

      - name: A - the branch starts
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots | Out-Null
          Copy-Item publish "$env:RUNNER_TEMP/a" -Recurse
          ./tools/Test-AppStart.ps1 -Exe "$env:RUNNER_TEMP/a/Moss365.exe" -Seconds 60 -Screenshot "$PWD/shots/A-branch.png"

      - name: B - 0.39.0 fails the start test
        timeout-minutes: 8
        shell: pwsh
        run: |
          gh release download v0.39.0 -D rel39 -p 'Moss365-win-x64-v0.39.0.zip' -p 'Moss365.Desktop-stable-Setup.exe'
          Expand-Archive rel39/Moss365-win-x64-v0.39.0.zip -DestinationPath app39
          try {
            ./tools/Test-AppStart.ps1 -Exe "$PWD/app39/Moss365.exe" -Seconds 60 -Screenshot "$PWD/shots/B-0.39.0.png"
            throw 'The start test did not see the error of 0.39.0'
          } catch {
            if ($_.Exception.Message -like 'The start test did not see*') { throw }
            Write-Host "As expected: $($_.Exception.Message)"
          }

      - name: C - repair an installed 0.39.0 with the new Setup.exe
        timeout-minutes: 15
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Moss365.Desktop'
          Get-Process Moss365 -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process (Resolve-Path rel39/Moss365.Desktop-stable-Setup.exe).Path -ArgumentList '--silent' -PassThru
          if (-not $p.WaitForExit(180000)) { Write-Host 'Setup 0.39.0 still running after 3 minutes' }
          Start-Sleep -Seconds 15
          Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Get-Process Moss365 -ErrorAction SilentlyContinue)) { Start-Process (Join-Path $root 'current/Moss365.exe') | Out-Null; Start-Sleep -Seconds 15 }
          Get-Process Moss365 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "0.39.0 running (as a user would leave it): $($_.Path)" }

          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Moss365.Desktop --packVersion 0.40.0 --packDir publish --mainExe Moss365.exe `
            --packTitle Moss365 --packAuthors "Moss365 contributors" --channel stable --icon src/Moss365.Desktop/moss365.ico -o new
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          Get-ChildItem new | ForEach-Object { Write-Host "  $($_.Name)" }

          $p = Start-Process (Resolve-Path new/Moss365.Desktop-stable-Setup.exe).Path -ArgumentList '--silent' -PassThru
          if (-not $p.WaitForExit(240000)) { Write-Host 'Setup 0.40.0 still running after 4 minutes' }
          Write-Host "Setup 0.40.0 exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 15
          Get-Process Moss365 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "running: $($_.Path) $($_.MainModule.FileVersionInfo.ProductVersion)" }
          Get-Process Moss365, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $exe = Join-Path $root 'current/Moss365.exe'
          Write-Host "installed: $((Get-Item $exe).VersionInfo.ProductVersion)"
          Get-ChildItem $root -Filter *.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
          ./tools/Test-AppStart.ps1 -Exe $exe -Seconds 60 -Screenshot "$PWD/shots/C-repaired.png"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnose
          path: shots
          retention-days: 7
